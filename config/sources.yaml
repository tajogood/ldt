  - id: mafra_brucella_restriction
    title: 소 브루셀라 이동제한 (연·읍면동)
    title_en: Cattle brucellosis movement restrictions
    refresh: yearly
    group: extra
    provider: mafra
    service_id: Grid_20151028000000000250_1
    iterate: {param: YM, kind: year, from: 2014}
    target: region_stat
    fixed: {species: cattle}
    map: {as_of: [YM], sido: [ADMINIST_ATPT_NM], sigungu: [ADMINIST_SIGNGU_NM], emd: [ADMINIST_EMD_NM]}
    metrics: [{metric: brucella_restricted_farms, value: [MVMN_LMTT_FRMHS_CO]}]

  - id: mafra_brucella_test
    title: 소 브루셀라 검사결과 (일·읍면동, 약 35만 건)
    title_en: Cattle brucellosis test results
    refresh: monthly
    group: extra
    provider: mafra
    service_id: Grid_20151028000000000249_1
    target: region_stat
    map: {as_of: [PRSEC_DE], species: [LVSTCKSPC_NM], sido: [ADMINIST_ATPT_NM], sigungu: [ADMINIST_SIGNGU_NM], emd: [ADMINIST_EMD_NM]}
    metrics:
      - {metric: brucella_tested_farms, value: [PRSEC_RESULT_FRMHS_CO]}
      - {metric: brucella_positive_farms, value: [TRNNG_OCCRRNC_FRMHS_CO]}
      - {metric: brucella_positive_heads, value: [TRNNG_OCCRRNC_LVSTCKCNT]}

  - id: mafra_insurance_claims_sido
    title: 시도별 사고원인 가축보험금 지급
    title_en: Livestock insurance claims by province and cause
    refresh: yearly
    group: extra
    provider: mafra
    service_id: Grid_20161213000000000408_1
    target: region_stat
    map: {as_of: [YEAR], sido: [CTPRVN]}
    metrics:
      - {metric: insurance_claims, value: [PYMNT_CO], suffix: [ACDNT_TY]}
      - {metric: insurance_amount, value: [INSRNC_AMOUNT], suffix: [ACDNT_TY]}

  - id: mafra_insurance_enrol
    title: 축종별 가축보험 가입
    title_en: Livestock insurance enrolment by species
    refresh: yearly
    group: extra
