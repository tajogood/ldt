    service_id: Grid_20161213000000000412_1
    target: region_stat
    map: {as_of: [YEAR], species: [LVSTCKSPC]}
    metrics:
      - {metric: insured_rate, value: [SBSCRB_RT], suffix: [LVSTCKSPC]}
      - {metric: insured_heads, value: [SBSCRB_LVSTCK_CO], suffix: [LVSTCKSPC]}

  - id: mafra_insurance_paid
    title: 축종별 가축보험금 지급
    title_en: Livestock insurance payouts by species
    refresh: yearly
    group: extra
