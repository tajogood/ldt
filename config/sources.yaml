    metrics: [{metric: slaughter_chicken, value: [THSMON], suffix: [DETAIL_LVSTCKSPC_NM]}]

  - id: mafra_slaughter_cattle
    title: 소 품종별 암수별 도축실적 (월)
    title_en: Monthly cattle slaughter by breed and sex
