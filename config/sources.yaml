# 수집 원천 정의
#
# endpoint / service_id 가 비어 있으면 그 원천은 건너뜁니다.
#   - 공공데이터포털: 마이페이지 > 오픈API > 해당 API 상세 > End Point + 상세기능 오퍼레이션
#   - 농식품 빅데이터 포털: 데이터 상세 > OpenAPI 탭 샘플 URL 의 서비스ID (Grid_... 형태)
#
# map: 표준 컬럼 ← 원천 컬럼 후보(앞에서부터 먼저 있는 것을 씀, 대소문자 무시)
#      `python -m app.cli probe <id>` 로 실제 필드명을 본 뒤 맨 앞에 추가하면 됩니다.
# fixed: 모든 행에 넣을 고정값
# refresh: 기대 갱신 주기(daily/weekly/monthly/yearly/manual). 2배 넘게 지나면 화면에 '지연' 표시
# coords: x/y 후보 + 원천 좌표계(EPSG). 4326 이면 x=경도, y=위도.

sources:

  # ── 농식품 빅데이터 포털 (data.mafra.go.kr) ─────────────────────────────
  # 서비스 ID·필드는 2026-10-26 포털 상세 페이지에서 확인. 호출은 MAFRA_KEY 로.
  # group: core = 기본 수집(run.sh), extra = 필요할 때 `collect group:extra`
  # 데이터 시점(2026-10-26 첫 수집 기준): 가축 질병 발생 정보 1995-06 ~ 2026-10-22(현행),
  #   질병발생 통계 ~2024-12, 브루셀라 이동제한 ~2016. 야생조류·멧돼지 검출은 manual_events 로 보완.

  - id: mafra_disease_outbreak
    title: 가축 질병 발생 정보
    title_en: Livestock disease outbreaks
    refresh: monthly
    group: core
    provider: mafra
    service_id: Grid_20151204000000000316_1
    target: event
    fixed: {kind: outbreak}
    addr_from: [FARM_LOCPLC]
    map:
      date: [OCCRRNC_DE]
      disease: [LKNTS_NM]
      species: [LVSTCKSPC_NM]
      subspecies: [LVSTCKSPC_NM]
      place: [FARM_LOCPLC]          # 리 단위 소재지 (농장명은 화면에 노출하지 않음)
      legal_code: [FARM_LOCPLC_LEGALDONG_CODE]
      heads: [OCCRRNC_LVSTCKCNT]
      note: [DGNSS_ENGN_NM]
    uid_from: [ICTSD_OCCRRNC_NO]
    geocode: true                   # place 주소 → 브이월드 좌표 (python -m app.cli geocode)

  - id: mafra_disease_stats
    title: 질병발생 통계 (월·시도·질병)
    title_en: Monthly disease statistics by province
    refresh: monthly
    group: core
    provider: mafra
    service_id: Grid_20220621000000000615_1
    iterate: {param: QRANT_COMPT_MT, kind: month, from: "2018-01"}
    target: region_stat
    map:
      as_of: [QRANT_COMPT_MT]
      sido: [CTPRVN_NM]
      species: [LVSTCK_KIND_CD_NM]
    metrics:
      - {metric: outbreak_farms, value: [OCCRRNC_FRMHS_CNT], suffix: [LVSTCK_KIND_CD_NM, DISE_CD_NM]}
      - {metric: outbreak_heads, value: [OCCRRNC_CNT], suffix: [LVSTCK_KIND_CD_NM, DISE_CD_NM]}

  - id: mafra_disinfection
    title: 거점소독시설
    title_en: Hub disinfection facilities
    refresh: weekly
    group: core
    provider: mafra
    service_id: Grid_20220621000000000618_1
    target: facility
    fixed: {kind: disinfection}
    addr_from: [ADDR]
    map:
      name: [PSTN_DSNF_PLC_NM]
      address: [ADDR]
      status: [OPER_HR]
    coords: {y: [LAT], x: [LOT], crs: "4326"}
    uid_from: [name, address]

  - id: mafra_farm_by_area
    title: 지역별 농장 통계 (읍면동·축종)
    title_en: Farms by area and species
    refresh: monthly
    group: core
    provider: mafra
    service_id: Grid_20220824000000000642_1
    target: region_stat
    map: {sido: [CTPRVN_NM], sigungu: [SIGUNGU_NM], emd: [EMD_NM], species: [LVSTCK_NM]}
    metrics: [{metric: farms, value: [FARM_CO], suffix: [LVSTCK_NM]}]

  - id: mafra_farm_by_scale
    title: 읍면동 사육두수 (축종)
    title_en: Heads kept by township and species
    refresh: monthly
    group: core
    provider: mafra
    service_id: Grid_20220823000000000637_1
    target: region_stat
    map: {sido: [CTPRVN_NM], sigungu: [SIGUNGU_NM], emd: [EMD_NM], species: [LVSTCK_NM]}
    # BRD_HEAD_QY 는 규모 구간이 아니라 그 읍면동·축종의 사육두수 합계(FARM_CO 는 농장 수)
    metrics: [{metric: heads, value: [BRD_HEAD_QY], suffix: [LVSTCK_NM]}]

  - id: mafra_farm_by_status
    title: 운영상태별 농장 통계
    title_en: Farms by operating status
    refresh: monthly
    group: core
    provider: mafra
    service_id: Grid_20220823000000000638_1
    target: region_stat
    map: {sido: [CTPRVN_NM], sigungu: [SIGUNGU_NM], emd: [EMD_NM], species: [LVSTCK_NM]}
    metrics: [{metric: farms_by_status, value: [FARM_CO], suffix: [LVSTCK_NM, OPER_STTUS_NM]}]

  - id: mafra_farm_by_industry
    title: 업종별 농장 통계
    title_en: Farms by industry type
