    service_id: Grid_20220824000000000640_1
    target: region_stat
    map: {sido: [CTPRVN_NM], sigungu: [SIGUNGU_NM], emd: [EMD_NM], species: [LVSTCK_NM]}
    metrics: [{metric: farms_by_species, value: [FARM_CO], suffix: [LVSTCK_NM]}]

  - id: mafra_farm_by_disease_target
    title: 대상질병별 농장 통계
    title_en: Farms by target disease
    refresh: monthly
    group: core
    provider: mafra
    service_id: Grid_20220823000000000636_1
    target: region_stat
    map: {sido: [CTPRVN_NM], sigungu: [SIGUNGU_NM], emd: [EMD_NM], species: [LVSTCK_NM]}
    metrics: [{metric: farms_target, value: [FARM_CO], suffix: [LVSTCK_NM, FARM_DISEASE_NM]}]

  - id: mafra_livestock_heads
    title: 가축 통계 데이터 (질병 대상 사육 두수)
    title_en: Livestock head counts by target disease
    refresh: monthly
    group: core
    provider: mafra
    service_id: Grid_20220823000000000635_1
    target: region_stat
    map: {sido: [CTPRVN_NM], sigungu: [SIGUNGU_NM], emd: [EMD_NM], species: [LVSTCK_NM]}
    metrics: [{metric: heads_target, value: [FARM_CO], suffix: [LVSTCK_NM, FARM_DISEASE_NM]}]

  - id: mafra_slaughter_by_plant
    title: 도축장별 축종별 도축실적 (월)
    title_en: Monthly slaughter by plant and species
    refresh: monthly
    group: core
    provider: mafra
    service_id: Grid_20161216000000000428_1
    iterate: {param: YM, kind: month, from: "2021-01"}
    target: context_ts
    map: {place: [SLAU_PLACE_NM], date: [YM], sido: [CTRD_NM]}
    metrics: [{metric: slaughter_heads, value: [THSMON], suffix: [LVSTCKSPC_NM]}]

  - id: mafra_slaughter_by_sido
    title: 시도별 도축실적 (월)
    title_en: Monthly slaughter by province
    refresh: monthly
    group: extra
    provider: mafra
