    service_id: Grid_20151028000000000251_1
    iterate: {param: SAUP_YEAR, kind: year, from: 2015}
    target: region_stat
    map: {as_of: [SAUP_YEAR], sido: [ADMINIST_ATPT_NM], sigungu: [ADMINIST_SIGNGU_NM], emd: [ADMINIST_EMD_NM]}
