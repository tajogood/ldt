    service_id: Grid_20151028000000000247_1
    iterate: {param: EXAMIN_YEAR, kind: year, from: 2015}
    target: region_stat
    map: {as_of: [EXAMIN_YEAR], sido: [ADMINIST_ATPT_NM], sigungu: [ADMINIST_SIGNGU_NM], emd: [ADMINIST_EMD_NM]}
    metrics: [{metric: manure_spray_tons, value: [LIFER_SPRAY_QY]}]

  - id: mafra_manure_by_crop
    title: 가축분뇨 작물별 액비살포 (연)
    title_en: Liquid manure spraying by crop
    refresh: yearly
    group: extra
    provider: mafra
    service_id: Grid_20151028000000000248_1
    iterate: {param: EXAMIN_YEAR, kind: year, from: 2015}
    target: region_stat
    map: {as_of: [EXAMIN_YEAR], sido: [ADMINIST_ATPT_NM], sigungu: [ADMINIST_SIGNGU_NM], emd: [ADMINIST_EMD_NM]}
    metrics: [{metric: manure_spray_tons, value: [SPRAY_QY], suffix: [CROPS_NM]}]

  # 아래 2종은 필수 파라미터 DDLN_DT(마감일자)에 맞는 값을 아직 찾지 못해 꺼 둠 (enabled: false)
  - id: mafra_vehicle_stats
    title: 축산차량 통계 (시도·용도)
    title_en: Registered livestock vehicles
    refresh: monthly
    group: extra
    enabled: false
    provider: mafra
    service_id: Grid_20220621000000000617_1
    iterate: {param: DDLN_DT, kind: list, values: ["20230920"]}
    target: region_stat
    map: {sido: [CTPRVN_NM], as_of: [DDLN_DT]}
    metrics: [{metric: vehicles_total, value: [TOTCNT]}]

  - id: mafra_facility_stats
    title: 축산관계시설 등록 통계
    title_en: Registered livestock-related facilities
    refresh: monthly
    group: extra
    enabled: false
    provider: mafra
    service_id: Grid_20220621000000000616_1
    iterate: {param: DDLN_DT, kind: list, values: ["20230920"]}
    target: region_stat
    map: {sido: [CTPRVN_NM], as_of: [DDLN_DT]}
    metrics:
      - {metric: facilities_total, value: [TOTCNT]}
      - {metric: slaughterhouses, value: [SLAU_CO_FCLTY_SE]}
      - {metric: poultry_slaughterhouses, value: [CH_CO_FCLTY_SE]}
      - {metric: hatcheries, value: [HTCYS_CO_FCLTY_SE]}
      - {metric: livestock_markets, value: [LVSTCK_MRKT_CO_FCLTY_SE]}

  # 링크형(다른 기관 API로 연결) — 포털 키로는 호출 불가, 해당 기관에서 따로 신청:
  #   한우 개체별/기간별 인공수정이력(hanwooai.co.kr), 소 및 쇠고기 개체정보·축산물DNA동일성검사·
  #   계란등급판정·축산물등급판정확인서(축산물품질평가원, data.go.kr), 팜맵 기상·토양·병해충(data.go.kr)
  #   동물등록 현황(반려동물)은 범위 밖이라 제외.

  # ── 공공데이터포털 ─────────────────────────────────────────────
  - id: mois_livestock_farming
    title: 행정안전부 동물_가축사육업 (농장 좌표)
    title_en: Livestock farming licences (MOIS, farm locations)
    refresh: weekly
    group: core
    provider: datagokr
    endpoint: https://apis.data.go.kr/1741000/livestock_farming_v2/info_v2
    # 처음엔 영업 중(01)인 농장만 전부(약 10만 곳, 100건씩), 이후에는 갱신시점 이후 바뀐 것만(폐업·휴업 포함)
    params: {returnType: json, "cond[SALS_STTS_CD::EQ]": "01"}
    paging: {page: pageNo, size: numOfRows, per: 100}
    incremental: {param: "cond[DAT_UPDT_PNT::GTE]", fmt: "%Y%m%d%H%M%S", overlap_days: 3, drop: ["cond[SALS_STTS_CD::EQ]"]}
    target: facility
    fixed: {kind: farm}
    addr_from: [LOTNO_ADDR, ROAD_NM_ADDR]
    map:
      name: [BPLC_NM]
      status: [SALS_STTS_NM, DTL_SALS_STTS_NM]
      species: [PRMN_LSFBIZ_SPECS]
      address: [LOTNO_ADDR, ROAD_NM_ADDR]
      size: [LCTN_AREA]
    coords: {x: [CRD_INFO_X], y: [CRD_INFO_Y], crs: "5174"}
    uid_from: [MNG_NO, OPN_ATMY_GRP_CD]

  - id: mois_ai_center
    title: 행정안전부 동물_가축인공수정소
    title_en: Artificial insemination centres (MOIS)
    refresh: weekly
    provider: datagokr
    endpoint: https://apis.data.go.kr/1741000/artificial_insemination_centers/info   # 활용신청 승인 후 동작
    params: {returnType: json}
    paging: {page: pageNo, size: numOfRows, per: 100}
    target: facility
    fixed: {kind: ai_center, species: cattle}
    map:
      name: [BPLC_NM, bplcNm]
      status: [DTL_SALS_STTS_NM, SALS_STTS_NM, dtlStateNm]
      address: [ROAD_NM_ADDR, LOTNO_ADDR, rdnWhlAddr, siteWhlAddr]
    coords: {x: [CRD_INFO_X, x], y: [CRD_INFO_Y, y], crs: "5174"}
    uid_from: [MNG_NO, mgtNo, name, address]

  - id: kma_asos_daily
    title: 기상청 ASOS 일자료
    title_en: KMA ASOS daily weather
    refresh: daily
    provider: kma_asos
    endpoint: https://apis.data.go.kr/1360000/AsosDalyInfoService/getWthrDataList
    # 전국 ASOS 관측소(위치는 app/stations.py). 지도에 기온 색 점으로 표시.
