    service_id: Grid_20220824000000000641_1
    target: region_stat
    map: {sido: [CTPRVN_NM], sigungu: [SIGUNGU_NM], emd: [EMD_NM], species: [LVSTCK_NM]}
    metrics: [{metric: farms_by_industry, value: [FARM_CO], suffix: [LVSTCK_NM, INDUTY_CODE]}]

  - id: mafra_farm_by_species
    title: 축종별 농장 통계
    title_en: Farms by species code
    refresh: monthly
