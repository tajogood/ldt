    service_id: Grid_20161213000000000413_1
    target: region_stat
    map: {as_of: [YEAR], species: [LVSTCKSPC]}
    metrics:
      - {metric: insurance_payouts, value: [PYMNT_CO], suffix: [LVSTCKSPC]}
      - {metric: insurance_loss_ratio, value: [DMAGE_RT], suffix: [LVSTCKSPC]}

  - id: mafra_ai_technicians
    title: 가축인공수정사 면허 현황 (연)
    title_en: AI technician licences by area
    refresh: yearly
    group: extra
    provider: mafra
    service_id: Grid_20141222000000000129_1
    iterate: {param: YEAR, kind: year, from: 2014}
    target: region_stat
    map: {as_of: [YEAR], sido: [CTPRVN], sigungu: [SIGNGU], emd: [EMD]}
    metrics: [{metric: ai_technicians_active, value: [STTUS_NRMLT_CO]}]

  - id: mafra_closure_support
    title: 폐업지원 신청현황 (연)
    title_en: Farm closure support applications
